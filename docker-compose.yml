# One command: docker compose up --build   →   http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfcoach
      POSTGRES_PASSWORD: cfcoach
      POSTGRES_DB: cfcoach
    ports:
      - "5433:5432"   # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfcoach -d cfcoach"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      CFC_DATABASE_URL: postgresql+psycopg://cfcoach:cfcoach@db:5432/cfcoach
      CFC_TRUST_PROXY: "true"
      CFC_CORS_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      CFC_DATABASE_URL: postgresql+psycopg://cfcoach:cfcoach@db:5432/cfcoach
    depends_on:
      backend:
        condition: service_healthy   # migrations have run
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
